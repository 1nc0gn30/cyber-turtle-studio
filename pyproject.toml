[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-turtle-studio"
version = "0.1.0"
description = "High-precision Turtle graphics, L-System fractal synthesizer, CNC G-Code plotter, and Studio (design influenced by Material 3 tokens)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "1nc0gn30", email = "neo@users.noreply.github.com" },
]
keywords = [
    "turtle-graphics",
    "lsystem",
    "fractals",
    "gcode",
    "cnc-plotter",
    "svg",
    "mcp",
    "material-design",
    "math-art",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
cyber-turtle-studio = "cyber_turtle_studio.cli:main"
cyber-turtle = "cyber_turtle_studio.cli:main"

[project.urls]
Homepage = "https://github.com/1nc0gn30/cyber-turtle-studio"
Repository = "https://github.com/1nc0gn30/cyber-turtle-studio"
Documentation = "https://github.com/1nc0gn30/cyber-turtle-studio#readme"
"Bug Tracker" = "https://github.com/1nc0gn30/cyber-turtle-studio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
